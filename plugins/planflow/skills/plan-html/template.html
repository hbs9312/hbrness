<!DOCTYPE html>
<html lang="{{LANG}}" data-theme="auto">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}} · planflow</title>
<style>
  :root {
    --c-bg: #ffffff;
    --c-bg-soft: #f7f8fa;
    --c-bg-card: #ffffff;
    --c-bg-elevated: #ffffff;
    --c-border: #e4e6eb;
    --c-border-strong: #c8ccd2;
    --c-text: #1f2328;
    --c-text-muted: #6b7280;
    --c-text-subtle: #9aa0a6;
    --c-accent: #2563eb;
    --c-accent-soft: #dbeafe;
    --c-success: #16a34a;
    --c-success-soft: #dcfce7;
    --c-warn: #d97706;
    --c-warn-soft: #fef3c7;
    --c-danger: #dc2626;
    --c-danger-soft: #fee2e2;
    --c-add: #16a34a;
    --c-modify: #2563eb;
    --c-delete: #dc2626;
    --c-rename: #7c3aed;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard Variable", Pretendard, system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="dark"] {
    --c-bg: #0f1115;
    --c-bg-soft: #161922;
    --c-bg-card: #1a1d26;
    --c-bg-elevated: #20242e;
    --c-border: #2a2e38;
    --c-border-strong: #3a3f4b;
    --c-text: #e6e8eb;
    --c-text-muted: #9aa0a6;
    --c-text-subtle: #6b7280;
    --c-accent: #60a5fa;
    --c-accent-soft: #1e3a5f;
    --c-success: #4ade80;
    --c-success-soft: #14532d;
    --c-warn: #fbbf24;
    --c-warn-soft: #78350f;
    --c-danger: #f87171;
    --c-danger-soft: #7f1d1d;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);
  }
  @media (prefers-color-scheme: dark) {
    html[data-theme="auto"] {
      --c-bg: #0f1115; --c-bg-soft: #161922; --c-bg-card: #1a1d26; --c-bg-elevated: #20242e;
      --c-border: #2a2e38; --c-border-strong: #3a3f4b;
      --c-text: #e6e8eb; --c-text-muted: #9aa0a6; --c-text-subtle: #6b7280;
      --c-accent: #60a5fa; --c-accent-soft: #1e3a5f;
      --c-success: #4ade80; --c-success-soft: #14532d;
      --c-warn: #fbbf24; --c-warn-soft: #78350f;
      --c-danger: #f87171; --c-danger-soft: #7f1d1d;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--c-bg-soft);
    color: var(--c-text);
    line-height: 1.55;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--c-accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre { font-family: var(--font-mono); font-size: 13px; }

  /* Header */
  .header {
    position: sticky; top: 0; z-index: 30;
    background: var(--c-bg);
    border-bottom: 1px solid var(--c-border);
    padding: var(--space-3) var(--space-5);
    display: flex; align-items: center; gap: var(--space-4);
  }
  .header h1 {
    margin: 0; font-size: 17px; font-weight: 600;
    flex: 0 1 auto; max-width: 50%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .header .meta { color: var(--c-text-muted); font-size: 13px; }
  .header .progress-area { flex: 1; display: flex; align-items: center; gap: var(--space-2); justify-content: flex-end; }
  .progress-bar {
    width: 180px; height: 6px; background: var(--c-bg-soft);
    border: 1px solid var(--c-border); border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--c-accent);
    transition: width 0.25s ease;
  }

  .badge {
    display: inline-flex; align-items: center; gap: var(--space-1);
    padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
    background: var(--c-bg-soft); color: var(--c-text-muted); border: 1px solid var(--c-border);
  }
  .badge[data-status="draft"] { background: var(--c-warn-soft); color: var(--c-warn); border-color: transparent; }
  .badge[data-status="review"] { background: var(--c-accent-soft); color: var(--c-accent); border-color: transparent; }
  .badge[data-status="approved"] { background: var(--c-success-soft); color: var(--c-success); border-color: transparent; }

  .icon-btn {
    background: transparent; border: 1px solid var(--c-border);
    padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer;
    color: var(--c-text); font-size: 14px;
  }
  .icon-btn:hover { background: var(--c-bg-soft); }

  /* Layout */
  .layout {
    display: grid; grid-template-columns: 220px 1fr;
    gap: var(--space-6);
    max-width: 1180px; margin: 0 auto;
    padding: var(--space-5) var(--space-5) 120px;
  }
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    .toc { position: static !important; max-height: none !important; }
  }

  /* TOC */
  .toc {
    position: sticky; top: 72px;
    align-self: start;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    padding: var(--space-3);
    font-size: 13px;
  }
  .toc-title { font-weight: 600; color: var(--c-text-muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; margin-bottom: var(--space-2); }
  .toc a {
    display: block; padding: 6px 10px; border-radius: var(--radius-sm);
    color: var(--c-text-muted); text-decoration: none;
  }
  .toc a:hover { background: var(--c-bg); color: var(--c-text); }
  .toc a.active { background: var(--c-accent-soft); color: var(--c-accent); font-weight: 500; }

  /* Sections */
  section {
    margin-bottom: var(--space-7);
    scroll-margin-top: 80px;
  }
  section h2 {
    margin: 0 0 var(--space-4); font-size: 20px; font-weight: 600;
    display: flex; align-items: center; gap: var(--space-2);
  }
  section h2 .count { font-size: 13px; color: var(--c-text-muted); font-weight: 400; }
  .section-row { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
  .section-row h2 { margin: 0; }
  .view-toggle {
    margin-left: auto; display: inline-flex;
    background: var(--c-bg-soft); border: 1px solid var(--c-border);
    border-radius: var(--radius-sm); padding: 2px;
  }
  .view-btn {
    background: transparent; border: none; padding: 5px 12px;
    border-radius: 4px; cursor: pointer;
    color: var(--c-text-muted); font-size: 13px; font-family: inherit;
    transition: all 0.15s;
  }
  .view-btn:hover { color: var(--c-text); }
  .view-btn.active {
    background: var(--c-bg); color: var(--c-text); font-weight: 500;
    box-shadow: var(--shadow-sm);
  }

  .card {
    background: var(--c-bg-card);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    box-shadow: var(--shadow-sm);
  }

  /* Overview — prose-first sections (no cards) */
  .overview-stack { display: flex; flex-direction: column; gap: var(--space-4); }
  .ov-block { padding-left: var(--space-3); border-left: 3px solid var(--c-border); }
  .ov-block.prose {
    padding: 0 0 0 var(--space-4);
    border-left-width: 4px;
  }
  .ov-title {
    margin: 0 0 var(--space-2);
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--c-text-muted); font-weight: 600;
  }
  .ov-body { color: var(--c-text); font-size: 14.5px; line-height: 1.65; }
  .ov-block.prose .ov-body { font-size: 15px; line-height: 1.75; }
  .ov-text { margin: 0; }
  .ov-list { margin: 0; padding-left: 20px; }
  .ov-list li + li { margin-top: 4px; }
  .ov-block.summary { border-left-color: var(--c-accent); }
  .ov-block.summary .ov-title { color: var(--c-accent); }
  .ov-block.current-state { border-left-color: var(--c-border-strong); }
  .ov-block.proposed-approach { border-left-color: var(--c-success); }
  .ov-block.proposed-approach .ov-title { color: var(--c-success); }
  .ov-block.goal { border-left-color: var(--c-accent); }
  .ov-block.goal .ov-title { color: var(--c-accent); }
  .ov-block.review-focus { border-left-color: var(--c-warn); }
  .ov-block.review-focus .ov-title { color: var(--c-warn); }
  .ov-block.scope-in { border-left-color: var(--c-success); }
  .ov-block.scope-in .ov-title { color: var(--c-success); }
  .ov-block.scope-out { border-left-color: var(--c-border-strong); }
  .ov-block.criteria { border-left-color: var(--c-success); }
  .ov-block.criteria .ov-title { color: var(--c-success); }
  .ov-block.risks { border-left-color: var(--c-danger); }
  .ov-block.risks .ov-title { color: var(--c-danger); }

  /* Phases */
  .phases-list { display: flex; flex-direction: column; gap: var(--space-3); }
  .phase {
    display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-3);
    align-items: start; padding: var(--space-3) var(--space-4);
  }
  .phase-marker {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--c-accent-soft); color: var(--c-accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px;
  }
  .phase-name { font-weight: 600; }
  .phase-duration { color: var(--c-text-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .phase-tasks { margin: 4px 0 0; padding-left: 18px; color: var(--c-text-muted); font-size: 14px; }
  .phase-tasks li + li { margin-top: 2px; }
  .phase-deps { font-size: 12px; color: var(--c-text-subtle); margin-top: 4px; }
  .phase-content { min-width: 0; }
  .phase-sub-title {
    margin-top: var(--space-3);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--c-text-subtle); font-weight: 600;
  }
  .phase-sub-title-files {
    margin-top: var(--space-3); padding-top: var(--space-3);
    border-top: 1px dashed var(--c-border);
  }
  .phase-files { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 4px; }
  .phase-file {
    display: flex; align-items: baseline; gap: var(--space-2);
    font-size: 13px; flex-wrap: wrap; min-width: 0;
  }
  .phase-file .path { font-family: var(--font-mono); color: var(--c-text); word-break: break-all; }
  .phase-file .summary { color: var(--c-text-muted); }

  /* Files */
  .files-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .files-table th, .files-table td { text-align: left; padding: 10px var(--space-3); border-bottom: 1px solid var(--c-border); }
  .files-table th { font-weight: 600; color: var(--c-text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .files-table tr:last-child td { border-bottom: none; }
  .files-table .path { font-family: var(--font-mono); font-size: 13px; }
  .change-chip {
    display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm);
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    width: 64px; text-align: center; flex-shrink: 0;
  }
  .change-chip[data-type="add"] { background: var(--c-success-soft); color: var(--c-add); }
  .change-chip[data-type="modify"] { background: var(--c-accent-soft); color: var(--c-modify); }
  .change-chip[data-type="delete"] { background: var(--c-danger-soft); color: var(--c-delete); }
  .change-chip[data-type="rename"] { background: #ede9fe; color: var(--c-rename); }
  html[data-theme="dark"] .change-chip[data-type="rename"] { background: #4c1d95; color: #c4b5fd; }

  /* Diagrams */
  .diagram { margin-top: var(--space-3); }
  .diagram-title { font-weight: 600; margin-bottom: var(--space-2); }
  .mermaid { background: var(--c-bg-elevated); padding: var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--c-border); overflow-x: auto; }
  .diagram img { max-width: 100%; height: auto; border-radius: var(--radius-sm); border: 1px solid var(--c-border); }

  /* Decision rounds */
  .round {
    margin-bottom: var(--space-4);
    border: 1px solid var(--c-border); border-radius: var(--radius-md);
    background: var(--c-bg-card); overflow: hidden;
  }
  .round-header {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    cursor: pointer; user-select: none;
    border-bottom: 1px solid transparent;
    background: var(--c-bg-card);
  }
  body[data-view-mode="all"] .round-header { cursor: default; }
  body[data-view-mode="all"] .round-chevron { display: none; }
  /* "한번에" 모드: 라운드 구분 자체 제거 (헤더 숨김 + 박스 풀어 평평하게) */
  body[data-view-mode="all"] .round-header { display: none; }
  body[data-view-mode="all"] .round {
    border: none; box-shadow: none; background: transparent;
    margin-bottom: 0; border-radius: 0; overflow: visible;
  }
  body[data-view-mode="all"] .round[data-state="active"] {
    border: none; box-shadow: none;
  }
  body[data-view-mode="all"] .round-body { padding: 0; }
  body[data-view-mode="all"] .q { margin-bottom: var(--space-3); }
  body[data-view-mode="all"] .round + .round .q:first-child { margin-top: 0; }
  .round[data-open="true"] .round-header { border-bottom-color: var(--c-border); }
  .round-chevron { width: 16px; transition: transform 0.2s; color: var(--c-text-muted); }
  .round[data-open="true"] .round-chevron { transform: rotate(90deg); }
  .round-title { font-weight: 600; flex: 1; }
  .round-status {
    font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 500;
  }
  .round-status[data-state="active"] { background: var(--c-accent-soft); color: var(--c-accent); }
  .round-status[data-state="answered"] { background: var(--c-success-soft); color: var(--c-success); }
  .round-status[data-state="pending"] { background: var(--c-bg-soft); color: var(--c-text-muted); border: 1px solid var(--c-border); }
  .round-body { padding: var(--space-4); display: none; }
  .round[data-open="true"] .round-body { display: block; }
  .round[data-state="active"] { border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-soft); }

  /* Question card */
  .q {
    background: var(--c-bg-soft);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    margin-bottom: var(--space-3);
  }
  .q:last-child { margin-bottom: 0; }
  .q-label { font-weight: 600; margin-bottom: var(--space-1); display: flex; align-items: baseline; gap: var(--space-2); }
  .q-required { color: var(--c-danger); font-weight: 700; }
  .q-group {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--c-text-muted); font-weight: 600;
  }
  .q-context {
    color: var(--c-text-muted); font-size: 13px;
    margin-bottom: var(--space-3);
    border-left: 2px solid var(--c-border); padding-left: var(--space-3);
  }
  .q-meta {
    display: flex; flex-direction: column; gap: var(--space-2);
    margin: var(--space-3) 0;
  }
  .q-meta-block {
    padding: var(--space-3);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-sm);
    background: var(--c-bg);
    font-size: 13px;
  }
  .q-meta-title {
    margin-bottom: 6px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--c-text-subtle); font-weight: 700;
  }
  .q-meta-block p { margin: 0; color: var(--c-text-muted); }
  .q-evidence-list, .q-tradeoff-list {
    margin: 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 6px;
  }
  .q-evidence-list li, .q-tradeoff-list li {
    display: flex; align-items: baseline; gap: var(--space-2);
    color: var(--c-text-muted);
  }
  .q-evidence-path, .q-tradeoff-value {
    flex-shrink: 0;
    max-width: 48%;
    overflow-wrap: anywhere;
    padding: 2px 7px;
    border-radius: var(--radius-sm);
    background: var(--c-bg-soft);
    color: var(--c-text);
    border: 1px solid var(--c-border);
    font-size: 12px;
  }
  .q-evidence-path { font-family: var(--font-mono); }
  .q-recommendation {
    border-color: var(--c-success);
    background: var(--c-success-soft);
  }
  .q-recommendation .q-meta-title,
  .q-recommendation p { color: var(--c-success); }
  .q-input { margin-top: var(--space-2); }
  .q[data-readonly="true"] { background: transparent; }
  .q[data-readonly="true"] .q-input { display: none; }
  .q-answer-display {
    display: none; margin-top: var(--space-2);
    padding: var(--space-2) var(--space-3);
    background: var(--c-success-soft); color: var(--c-success);
    border-radius: var(--radius-sm); font-weight: 500;
    word-break: break-word;
  }
  .q[data-readonly="true"] .q-answer-display { display: block; }

  /* Form controls */
  .input, .textarea, .select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--c-border);
    border-radius: var(--radius-sm);
    background: var(--c-bg);
    color: var(--c-text);
    font-family: inherit; font-size: 14px;
  }
  .textarea { resize: vertical; min-height: 80px; }
  .input:focus, .textarea:focus, .select:focus { outline: 2px solid var(--c-accent); outline-offset: -1px; border-color: var(--c-accent); }

  .opt-group { display: flex; flex-direction: column; gap: 6px; }
  .opt {
    display: flex; align-items: center; gap: var(--space-2);
    padding: 8px 12px; border: 1px solid var(--c-border); border-radius: var(--radius-sm);
    background: var(--c-bg); cursor: pointer;
  }
  .opt:hover { background: var(--c-bg-soft); border-color: var(--c-border-strong); }
  .opt input { margin: 0; accent-color: var(--c-accent); }
  .opt-label { flex: 1; }
  .opt-other {
    align-items: center;
    flex-wrap: wrap;
  }
  .opt-other .opt-label { flex: 0 0 auto; }
  .opt-other-input {
    flex: 1 1 220px;
    min-width: 180px;
    padding: 6px 10px;
    font-size: 13px;
  }

  .slider-wrap { display: flex; align-items: center; gap: var(--space-3); }
  .slider { flex: 1; accent-color: var(--c-accent); }
  .slider-val {
    min-width: 60px; text-align: right;
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    color: var(--c-accent); font-weight: 600;
  }

  .toggle-row { display: flex; align-items: center; gap: var(--space-3); }
  .toggle {
    position: relative; width: 42px; height: 24px;
    background: var(--c-border); border-radius: 999px; cursor: pointer;
    transition: background 0.2s;
  }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 20px; height: 20px; background: white; border-radius: 50%;
    transition: transform 0.2s; box-shadow: var(--shadow-sm);
  }
  .toggle input { display: none; }
  .toggle[data-on="true"] { background: var(--c-accent); }
  .toggle[data-on="true"]::after { transform: translateX(18px); }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: var(--c-bg); border: 1px solid var(--c-border); border-radius: var(--radius-sm); min-height: 38px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; background: var(--c-accent-soft); color: var(--c-accent); border-radius: var(--radius-sm); font-size: 13px; }
  .tag button { background: none; border: none; color: inherit; cursor: pointer; padding: 0; font-size: 14px; line-height: 1; }
  .tag-input-field { flex: 1; min-width: 100px; border: none; outline: none; background: transparent; color: var(--c-text); font-size: 14px; padding: 4px; }

  /* Submit row */
  .submit-row { display: flex; justify-content: flex-end; gap: var(--space-3); margin-top: var(--space-4); }
  .btn {
    padding: 8px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--c-border); background: var(--c-bg);
    color: var(--c-text); cursor: pointer; font-weight: 500; font-size: 14px;
    font-family: inherit;
    white-space: nowrap; flex-shrink: 0;
  }
  .btn:hover { background: var(--c-bg-soft); }
  .btn-primary { background: var(--c-accent); color: white; border-color: var(--c-accent); }
  .btn-primary:hover { filter: brightness(1.05); background: var(--c-accent); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Ask Claude */
  .ask {
    margin-top: var(--space-6);
    padding: var(--space-4);
  }
  .ask-input-row { display: flex; gap: var(--space-2); margin-top: var(--space-2); align-items: stretch; }
  .ask-input-row .textarea { flex: 1; min-width: 0; }
  .ask-log { margin-top: var(--space-3); display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
  .ask-item { display: flex; gap: var(--space-3); padding: 8px 12px; background: var(--c-bg-soft); border-radius: var(--radius-sm); font-size: 13px; }
  .ask-time { color: var(--c-text-subtle); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .ask-text { flex: 1; word-break: break-word; }
  .ask-status { color: var(--c-success); font-size: 12px; }

  /* Footer */
  .footer {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: var(--c-bg); border-top: 1px solid var(--c-border);
    padding: var(--space-3) var(--space-5);
    display: flex; align-items: center; gap: var(--space-3);
  }
  .footer .summary { color: var(--c-text-muted); font-size: 13px; }
  .footer .summary strong { color: var(--c-text); }
  .footer .actions { margin-left: auto; display: flex; gap: var(--space-2); }

  .toast {
    position: fixed; top: 80px; right: 24px; z-index: 100;
    padding: 10px 16px; background: var(--c-text); color: var(--c-bg);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
    opacity: 0; transform: translateY(-8px); transition: all 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .empty { color: var(--c-text-subtle); font-style: italic; }

  /* === Inline Review / Comments === */
  [data-anchor-id] { position: relative; }
  [data-anchor-id].has-comments {
    background: rgba(250, 204, 21, 0.16);
    outline: 1px dashed rgba(250, 204, 21, 0.55);
    outline-offset: 2px;
    border-radius: 3px;
  }
  .comment-badge {
    display: inline-flex; align-items: center; justify-content: center;
    position: absolute; top: -8px; right: -8px;
    min-width: 18px; height: 18px; padding: 0 5px;
    background: var(--c-warn); color: #fff;
    font-size: 11px; font-weight: 700; border-radius: 999px;
    cursor: pointer; box-shadow: var(--shadow-sm); z-index: 5;
  }
  .comment-badge:hover { filter: brightness(1.1); }
  [data-anchor-id].flash { animation: cflash 1.2s ease; }
  @keyframes cflash { 0%, 100% { background: rgba(250, 204, 21, 0.16); } 50% { background: rgba(250, 204, 21, 0.45); } }

  .comment-bubble { position: absolute; z-index: 40; }
  .comment-bubble button {
    padding: 6px 12px; border-radius: 999px;
    background: var(--c-accent); color: white; border: none;
    cursor: pointer; box-shadow: var(--shadow-md); font-size: 13px; font-weight: 500;
    font-family: inherit;
  }
  .comment-bubble button:hover { filter: brightness(1.1); }

  .comment-popover {
    position: absolute; z-index: 50; width: 380px; max-width: 90vw;
    background: var(--c-bg); border: 1px solid var(--c-border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-md);
    padding: var(--space-3);
  }
  .popover-quote {
    padding: var(--space-2) var(--space-3); margin-bottom: var(--space-2);
    background: rgba(250, 204, 21, 0.12);
    border-left: 3px solid var(--c-warn);
    border-radius: 0 4px 4px 0;
    font-size: 13px; color: var(--c-text-muted);
    max-height: 80px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  }
  .popover-input {
    width: 100%; min-height: 70px; padding: 8px 12px;
    border: 1px solid var(--c-border); border-radius: var(--radius-sm);
    background: var(--c-bg-soft); color: var(--c-text); font-family: inherit; font-size: 14px;
    resize: vertical;
  }
  .popover-input:focus { outline: 2px solid var(--c-accent); outline-offset: -1px; border-color: var(--c-accent); }
  .popover-actions { display: flex; gap: var(--space-2); justify-content: flex-end; margin-top: var(--space-2); }

  .comments-toggle {
    position: fixed; top: 80px; right: 0; z-index: 28;
    padding: 8px 12px; border: 1px solid var(--c-border); border-right: none;
    border-radius: var(--radius-sm) 0 0 var(--radius-sm);
    background: var(--c-bg-card); color: var(--c-text);
    cursor: pointer; box-shadow: var(--shadow-sm);
    font-size: 14px; font-family: inherit;
    display: flex; align-items: center; gap: 6px;
  }
  .comments-toggle:hover { background: var(--c-bg-soft); }
  .comments-toggle .count { font-weight: 600; font-size: 12px; }
  .comments-toggle .count:empty { display: none; }
  .comments-toggle.has-items { background: var(--c-warn); color: white; border-color: var(--c-warn); }
  .comments-toggle.has-items:hover { filter: brightness(1.05); background: var(--c-warn); }

  .comments-sidebar {
    position: fixed; top: 60px; right: 0; bottom: 64px;
    width: 360px; max-width: 90vw;
    background: var(--c-bg); border-left: 1px solid var(--c-border);
    transform: translateX(100%); transition: transform 0.2s ease;
    z-index: 27; display: flex; flex-direction: column;
    box-shadow: -4px 0 12px rgba(0,0,0,0.12);
  }
  .comments-sidebar.open { transform: translateX(0); }
  .comments-header {
    display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--c-border);
  }
  .comments-header h3 { margin: 0; font-size: 15px; flex: 1; }
  .comments-body { flex: 1; overflow-y: auto; padding: var(--space-3); }
  .comments-footer {
    display: none; padding: var(--space-3); border-top: 1px solid var(--c-border);
    gap: var(--space-2); justify-content: flex-end;
  }
  .csec { margin-bottom: var(--space-4); }
  .csec h4 {
    margin: 0 0 var(--space-2);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--c-text-muted); font-weight: 600;
    display: flex; align-items: center; gap: var(--space-2);
  }
  .csec[data-section="resolved"] h4 { cursor: pointer; }
  .csec-count {
    padding: 1px 7px; background: var(--c-bg-soft); border-radius: 999px;
    font-size: 10px; color: var(--c-text); font-weight: 600;
  }
  .csec-toggle { margin-left: auto; font-size: 10px; }

  .cc {
    background: var(--c-bg-card); border: 1px solid var(--c-border);
    border-radius: var(--radius-sm); padding: var(--space-3);
    margin-bottom: var(--space-2); font-size: 13px;
  }
  .cc-quote {
    padding: 4px 8px; margin-bottom: 6px;
    background: rgba(250, 204, 21, 0.10);
    border-left: 2px solid var(--c-warn);
    color: var(--c-text-muted); font-size: 12px;
    border-radius: 0 4px 4px 0;
    word-break: break-word;
  }
  .cc-quote[data-jump-to] { cursor: pointer; }
  .cc-quote[data-jump-to]:hover { background: rgba(250, 204, 21, 0.20); }
  .cc-body { color: var(--c-text); word-break: break-word; margin-bottom: var(--space-2); white-space: pre-wrap; }
  .cc-input {
    width: 100%; min-height: 56px; padding: 6px 10px; margin-bottom: 6px;
    border: 1px solid var(--c-border); border-radius: var(--radius-sm);
    background: var(--c-bg-soft); color: var(--c-text); font-family: inherit; font-size: 13px;
    resize: vertical;
  }
  .cc-reply {
    margin-top: 6px; padding: 6px 10px;
    background: var(--c-bg-soft); border-radius: var(--radius-sm);
    border-left: 3px solid var(--c-accent);
  }
  .cc-reply-claude { border-left-color: var(--c-success); }
  .cc-reply-user { border-left-color: var(--c-accent); }
  .cc-reply-head {
    font-size: 11px; font-weight: 600; color: var(--c-text-muted); margin-bottom: 4px;
  }
  .cc-time { font-weight: 400; }
  .cc-reply-body { color: var(--c-text); word-break: break-word; white-space: pre-wrap; }
  .cc-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
  .cc-action {
    padding: 4px 10px; border: 1px solid var(--c-border); background: transparent;
    border-radius: 4px; cursor: pointer; font-size: 12px; color: var(--c-text-muted);
    font-family: inherit;
  }
  .cc-action:hover { background: var(--c-bg-soft); color: var(--c-text); }
  .cc-action.danger { color: var(--c-danger); border-color: var(--c-danger); }
  .cc-resolved { opacity: 0.65; }
  .cc-orphaned { border-style: dashed; border-color: var(--c-danger); }
  .cc-orphan-tag {
    display: inline-block; padding: 1px 6px; background: var(--c-danger-soft); color: var(--c-danger);
    border-radius: 4px; font-size: 10px; margin-left: 6px;
  }
</style>
</head>
<body data-plan-slug="{{PLAN_SLUG}}" data-helper-port="{{HELPER_PORT}}" data-lang="{{LANG}}" data-total-questions="{{TOTAL_QUESTIONS}}">

<header class="header">
  <h1>{{TITLE}}</h1>
  <span class="badge" data-status="{{STATUS}}">{{STATUS_LABEL}}</span>
  <span class="meta">{{CREATED_AT}}</span>
  <div class="progress-area">
    <span class="meta" id="progressLabel">0 / {{TOTAL_QUESTIONS}}</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
    <button class="icon-btn" id="themeToggle" title="Toggle theme">◐</button>
  </div>
</header>

<div class="layout">
  <nav class="toc card">
    <div class="toc-title" data-i18n-ko="목차" data-i18n-en="Contents">목차</div>
    {{{TOC_HTML}}}
  </nav>

  <main>
    {{{OVERVIEW_HTML}}}
    {{{PHASES_HTML}}}
    {{{FILES_HTML}}}
    {{{DIAGRAMS_HTML}}}

    <section id="decisions">
      <div class="section-row">
        <h2><span data-i18n-ko="결정사항" data-i18n-en="Decisions">결정사항</span> <span class="count" id="decisionsCount"></span></h2>
        <div class="view-toggle" role="tablist" aria-label="View mode">
          <button class="view-btn" data-view="rounds" data-i18n-ko="라운드별" data-i18n-en="By round">라운드별</button>
          <button class="view-btn" data-view="all" data-i18n-ko="한번에" data-i18n-en="All at once">한번에</button>
        </div>
      </div>
      {{{ROUNDS_HTML}}}
    </section>

    <section id="ask" class="card ask">
      <h2 style="margin-top:0"><span data-i18n-ko="Claude에게 질문하기" data-i18n-en="Ask Claude">Claude에게 질문하기</span></h2>
      <div class="q-context" data-i18n-ko="추가 정보가 필요하거나 계획에 의문이 있으면 여기서 보내세요. ⌘+Enter 로 전송." data-i18n-en="Send a follow-up question to Claude. ⌘+Enter to send.">
        추가 정보가 필요하거나 계획에 의문이 있으면 여기서 보내세요. ⌘+Enter 로 전송.
      </div>
      <div class="ask-input-row">
        <textarea class="textarea" id="askInput" rows="2" placeholder=""></textarea>
        <button class="btn btn-primary" id="askSend" data-i18n-ko="보내기" data-i18n-en="Send">보내기</button>
      </div>
      <div class="ask-log" id="askLog"></div>
    </section>
  </main>
</div>

<footer class="footer">
  <span class="summary" id="footerSummary"></span>
  <div class="actions">
    <button class="btn" id="copyJson" data-i18n-ko="JSON 복사" data-i18n-en="Copy JSON">JSON 복사</button>
    <button class="btn btn-primary" id="submitActiveRound" data-i18n-ko="현재 라운드 제출" data-i18n-en="Submit Round">현재 라운드 제출</button>
  </div>
</footer>

<div class="toast" id="toast"></div>

<!-- Inline review UI -->
<div class="comment-bubble" id="commentBubble" style="display:none">
  <button id="commentBubbleBtn" type="button" aria-label="Add comment" data-i18n-ko="💬 코멘트" data-i18n-en="💬 Comment">💬 코멘트</button>
</div>

<div class="comment-popover" id="commentPopover" style="display:none" role="dialog" aria-label="Add comment">
  <div class="popover-quote"></div>
  <textarea class="popover-input" placeholder="" data-i18n-placeholder-ko="이 부분에 대한 코멘트…" data-i18n-placeholder-en="Comment about this…"></textarea>
  <div class="popover-actions">
    <button type="button" class="btn" data-action="cancel" data-i18n-ko="취소" data-i18n-en="Cancel">취소</button>
    <button type="button" class="btn btn-primary" data-action="add" data-i18n-ko="추가" data-i18n-en="Add">추가</button>
  </div>
</div>

<button id="commentsToggle" type="button" class="comments-toggle" title="리뷰 코멘트">
  💬 <span class="count"></span>
</button>

<aside id="commentsSidebar" class="comments-sidebar" aria-label="Comments">
  <div class="comments-header">
    <h3 data-i18n-ko="리뷰 코멘트" data-i18n-en="Review Comments">리뷰 코멘트</h3>
    <button id="commentsClose" type="button" class="icon-btn" aria-label="Close">✕</button>
  </div>
  <div class="comments-body" id="commentsBody"></div>
  <div class="comments-footer" id="commentsFooter"></div>
</aside>

<script>window._PLANFLOW_COMMENTS = {{COMMENTS_JSON}};</script>

<script>
(() => {
  const body = document.body;
  const PLAN_SLUG = body.dataset.planSlug;
  const HELPER_PORT = body.dataset.helperPort;
  const LANG = body.dataset.lang || 'ko';
  const HELPER_BASE = `http://localhost:${HELPER_PORT}`;
  const STORAGE_KEY = `planflow:${PLAN_SLUG}:answers`;
  const THEME_KEY = `planflow:${PLAN_SLUG}:theme`;

  const toast = (msg) => {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1800);
  };

  // --- i18n: replace text where data-i18n-* matches LANG
  document.querySelectorAll(`[data-i18n-${LANG}]`).forEach((el) => {
    const txt = el.getAttribute(`data-i18n-${LANG}`);
    if (txt) el.textContent = txt;
  });
  document.querySelectorAll(`[data-i18n-placeholder-${LANG}]`).forEach((el) => {
    const txt = el.getAttribute(`data-i18n-placeholder-${LANG}`);
    if (txt) el.placeholder = txt;
  });

  // --- Theme toggle (auto → light → dark → auto)
  const root = document.documentElement;
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) root.dataset.theme = savedTheme;
  document.getElementById('themeToggle').addEventListener('click', () => {
    const cur = root.dataset.theme || 'auto';
    const next = cur === 'auto' ? 'light' : cur === 'light' ? 'dark' : 'auto';
    root.dataset.theme = next;
    localStorage.setItem(THEME_KEY, next);
    toast(`Theme: ${next}`);
  });

  // --- Round open/close + state
  const rounds = document.querySelectorAll('.round');
  rounds.forEach((r) => {
    r.querySelector('.round-header').addEventListener('click', () => {
      if (document.body.dataset.viewMode === 'all') return;
      r.dataset.open = r.dataset.open === 'true' ? 'false' : 'true';
    });
  });

  // --- View mode toggle (rounds-only vs all-at-once)
  const VIEW_KEY = `planflow:${PLAN_SLUG}:view`;
  const applyView = (mode) => {
    document.body.dataset.viewMode = mode;
    document.querySelectorAll('.view-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.view === mode);
    });
    document.querySelectorAll('.round').forEach((r) => {
      if (mode === 'all') r.dataset.open = 'true';
      else r.dataset.open = r.dataset.state === 'active' ? 'true' : 'false';
    });
  };
  document.querySelectorAll('.view-btn').forEach((b) => {
    b.addEventListener('click', () => {
      localStorage.setItem(VIEW_KEY, b.dataset.view);
      applyView(b.dataset.view);
    });
  });
  applyView(localStorage.getItem(VIEW_KEY) || 'rounds');

  // --- Slider value sync
  document.querySelectorAll('.slider').forEach((s) => {
    const valEl = s.parentElement.querySelector('.slider-val');
    const unit = s.dataset.unit || '';
    const sync = () => { valEl.textContent = s.value + (unit ? ` ${unit}` : ''); };
    s.addEventListener('input', sync); sync();
  });

	  // --- Toggle widget (clickable, syncs hidden checkbox)
	  document.querySelectorAll('.toggle').forEach((t) => {
	    const input = t.querySelector('input');
	    const sync = () => { t.dataset.on = input.checked ? 'true' : 'false'; };
	    t.addEventListener('click', () => { input.checked = !input.checked; sync(); updateProgress(); });
	    sync();
	  });

	  // --- Custom option inputs for radio/checkbox questions
	  document.querySelectorAll('.opt-other').forEach((opt) => {
	    const choice = opt.querySelector('input[type="radio"], input[type="checkbox"]');
	    const field = opt.querySelector('[data-other-input]');
	    if (!choice || !field) return;
	    field.addEventListener('focus', () => {
	      choice.checked = true;
	      updateProgress();
	    });
	    field.addEventListener('input', () => {
	      if (field.value.trim()) choice.checked = true;
	    });
	  });

  // --- Tag input
  document.querySelectorAll('.tag-input-wrap').forEach((wrap) => {
    const field = wrap.querySelector('.tag-input-field');
    const hidden = wrap.querySelector('input[type="hidden"]');
    const renderTags = () => {
      const tags = JSON.parse(hidden.value || '[]');
      wrap.querySelectorAll('.tag').forEach((t) => t.remove());
      tags.forEach((tag, i) => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.innerHTML = `<span></span><button type="button" aria-label="remove">×</button>`;
        span.querySelector('span').textContent = tag;
        span.querySelector('button').addEventListener('click', () => {
          const cur = JSON.parse(hidden.value || '[]');
          cur.splice(i, 1);
          hidden.value = JSON.stringify(cur);
          renderTags();
          updateProgress();
        });
        wrap.insertBefore(span, field);
      });
    };
    field.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ',') && field.value.trim()) {
        e.preventDefault();
        const cur = JSON.parse(hidden.value || '[]');
        cur.push(field.value.trim());
        hidden.value = JSON.stringify(cur);
        field.value = '';
        renderTags();
        updateProgress();
      }
    });
    renderTags();
  });

  // --- Hydrate from localStorage (preserve answers across reloads)
  const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const setAnswerInDOM = (qid, value) => {
    const root = document.querySelector(`.q[data-qid="${qid}"]`);
    if (!root) return;
    const t = root.dataset.type;
    if (t === 'text' || t === 'textarea' || t === 'number' || t === 'date' || t === 'select') {
      const inp = root.querySelector('[name]');
      if (inp != null && value != null) inp.value = value;
    } else if (t === 'slider') {
      const inp = root.querySelector('input[type="range"]');
      if (inp && value != null) { inp.value = value; inp.dispatchEvent(new Event('input')); }
	    } else if (t === 'radio') {
	      const inp = root.querySelector(`input[type="radio"]:not([data-other-radio])[value="${CSS.escape(String(value))}"]`);
	      if (inp) {
	        inp.checked = true;
	      } else if (value != null) {
	        const other = root.querySelector('[data-other-radio]');
	        const field = root.querySelector('[data-other-input]');
	        if (other && field) {
	          other.checked = true;
	          field.value = String(value);
	        }
	      }
	    } else if (t === 'checkbox') {
	      const arr = Array.isArray(value) ? value : [];
	      const unmatched = [];
	      root.querySelectorAll('input[type="checkbox"]:not([data-other-checkbox])').forEach((c) => {
	        c.checked = arr.includes(c.value);
	      });
	      arr.forEach((v) => {
	        const match = root.querySelector(`input[type="checkbox"]:not([data-other-checkbox])[value="${CSS.escape(String(v))}"]`);
	        if (!match) unmatched.push(String(v));
	      });
	      const other = root.querySelector('[data-other-checkbox]');
	      const field = root.querySelector('[data-other-input]');
	      if (other && field && unmatched.length) {
	        other.checked = true;
	        field.value = unmatched.join(', ');
	      }
	    } else if (t === 'toggle') {
      const inp = root.querySelector('input[type="checkbox"]');
      if (inp) { inp.checked = !!value; inp.dispatchEvent(new Event('change')); }
      const tw = root.querySelector('.toggle');
      if (tw) tw.dataset.on = inp && inp.checked ? 'true' : 'false';
    } else if (t === 'tag-input') {
      const hidden = root.querySelector('input[type="hidden"]');
      if (hidden) {
        hidden.value = JSON.stringify(Array.isArray(value) ? value : []);
        const wrap = hidden.closest('.tag-input-wrap');
        if (wrap) {
          wrap.querySelectorAll('.tag').forEach((t) => t.remove());
          const ev = new Event('hydrate'); wrap.dispatchEvent(ev);
        }
      }
    }
  };
  Object.entries(stored).forEach(([k, v]) => setAnswerInDOM(k, v));
  // re-render tag chips after hydration
  document.querySelectorAll('.tag-input-wrap').forEach((wrap) => {
    const hidden = wrap.querySelector('input[type="hidden"]');
    const tags = JSON.parse(hidden.value || '[]');
    const field = wrap.querySelector('.tag-input-field');
    tags.forEach((tag) => {
      const span = document.createElement('span');
      span.className = 'tag';
      span.innerHTML = `<span></span><button type="button" aria-label="remove">×</button>`;
      span.querySelector('span').textContent = tag;
      span.querySelector('button').addEventListener('click', () => {
        const cur = JSON.parse(hidden.value || '[]');
        const idx = cur.indexOf(tag); if (idx >= 0) cur.splice(idx, 1);
        hidden.value = JSON.stringify(cur);
        span.remove();
        updateProgress();
      });
      wrap.insertBefore(span, field);
    });
  });

  // --- Collect answers from DOM
  const collectAnswers = (roundOnly) => {
    const out = {};
    const sel = roundOnly ? `.round[data-state="active"] .q` : `.q`;
    document.querySelectorAll(sel).forEach((root) => {
      const qid = root.dataset.qid;
      const t = root.dataset.type;
      if (root.dataset.readonly === 'true') {
        // already-answered question; skip (preserved by helper anyway)
        return;
      }
      let val;
      if (t === 'text' || t === 'textarea' || t === 'date') {
        val = root.querySelector('[name]')?.value || '';
        if (!val) return;
      } else if (t === 'number') {
        const raw = root.querySelector('[name]')?.value;
        if (raw === '' || raw == null) return;
        val = Number(raw);
      } else if (t === 'slider') {
        val = Number(root.querySelector('input[type="range"]').value);
      } else if (t === 'select') {
        val = root.querySelector('select').value;
        if (!val) return;
	      } else if (t === 'radio') {
	        const c = root.querySelector('input[type="radio"]:checked');
	        if (!c) return;
	        if (c.dataset.otherRadio != null) {
	          val = root.querySelector('[data-other-input]')?.value.trim() || '';
	          if (!val) return;
	        } else {
	          val = c.value;
	        }
	      } else if (t === 'checkbox') {
	        val = Array.from(root.querySelectorAll('input[type="checkbox"]:checked:not([data-other-checkbox])')).map((c) => c.value);
	        const other = root.querySelector('[data-other-checkbox]');
	        const otherVal = root.querySelector('[data-other-input]')?.value.trim() || '';
	        if (other && other.checked && otherVal) val.push(otherVal);
	        if (val.length === 0) return;
      } else if (t === 'toggle') {
        val = !!root.querySelector('input[type="checkbox"]').checked;
      } else if (t === 'tag-input') {
        val = JSON.parse(root.querySelector('input[type="hidden"]').value || '[]');
        if (val.length === 0) return;
      }
      out[qid] = val;
    });
    return out;
  };

  const persistAnswers = () => {
    const all = collectAnswers(false);
    const merged = { ...stored, ...all };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
  };

  // --- Progress
  const updateProgress = () => {
    persistAnswers();
    const total = Number(body.dataset.totalQuestions || 0);
    const answered = Object.keys(JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}')).length;
    document.getElementById('progressLabel').textContent = `${answered} / ${total}`;
    document.getElementById('progressFill').style.width = total ? `${(answered/total)*100}%` : '0%';
    const remain = total - answered;
    document.getElementById('footerSummary').innerHTML =
      remain > 0
        ? `<strong>${answered}</strong> / ${total} answered · <strong>${remain}</strong> remaining`
        : `<strong>All ${total} answered ✓</strong>`;
  };
  document.querySelectorAll('input, select, textarea').forEach((el) => {
    el.addEventListener('change', updateProgress);
    el.addEventListener('input', updateProgress);
  });
  updateProgress();

  // --- Submit active round
  document.getElementById('submitActiveRound').addEventListener('click', async () => {
    const activeRound = document.querySelector('.round[data-state="active"]');
    if (!activeRound) { toast('No active round'); return; }
    // validate required
    const missing = [];
    activeRound.querySelectorAll('.q[data-required="true"]').forEach((q) => {
      if (q.dataset.readonly === 'true') return;
      const ans = collectAnswers(true)[q.dataset.qid];
      if (ans === undefined) missing.push(q.dataset.qid);
    });
    if (missing.length) { toast(`Required: ${missing.join(', ')}`); return; }

    const answers = collectAnswers(true);
    try {
      const res = await fetch(`${HELPER_BASE}/answers`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ round: Number(activeRound.dataset.round || 1), answers }),
      });
      if (!res.ok) throw new Error(await res.text());
      toast('Submitted ✓');
    } catch (e) {
      toast('Error: ' + e.message);
    }
  });

  // --- Copy JSON
  document.getElementById('copyJson').addEventListener('click', async () => {
    const data = collectAnswers(false);
    await navigator.clipboard.writeText(JSON.stringify(data, null, 2));
    toast('Copied to clipboard');
  });

  // --- Ask Claude
  const askInput = document.getElementById('askInput');
  const askLog = document.getElementById('askLog');
  const sendAsk = async () => {
    const text = askInput.value.trim();
    if (!text) return;
    try {
      const res = await fetch(`${HELPER_BASE}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error(await res.text());
      const item = document.createElement('div');
      item.className = 'ask-item';
      const t = new Date().toLocaleTimeString();
      item.innerHTML = `<span class="ask-time"></span><span class="ask-text"></span><span class="ask-status">sent ✓</span>`;
      item.querySelector('.ask-time').textContent = t;
      item.querySelector('.ask-text').textContent = text;
      askLog.prepend(item);
      askInput.value = '';
    } catch (e) {
      toast('Error: ' + e.message);
    }
  };
  document.getElementById('askSend').addEventListener('click', sendAsk);
  askInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendAsk();
  });

  // --- TOC active highlight on scroll
  const tocLinks = document.querySelectorAll('.toc a[href^="#"]');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) {
        tocLinks.forEach((l) => l.classList.toggle('active', l.getAttribute('href') === '#' + e.target.id));
      }
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  document.querySelectorAll('section[id]').forEach((s) => observer.observe(s));

  // === Inline Review / Comments ===
  {
    const DRAFTS_KEY = `planflow:${PLAN_SLUG}:comment-drafts`;
    const OPEN_KEY   = `planflow:${PLAN_SLUG}:comments-open`;
    const RESOLVED_VISIBLE_KEY = `planflow:${PLAN_SLUG}:resolved-visible`;

    const submitted = Array.isArray(window._PLANFLOW_COMMENTS) ? window._PLANFLOW_COMMENTS : [];
    let drafts = [];
    try { drafts = JSON.parse(localStorage.getItem(DRAFTS_KEY) || '[]'); } catch { drafts = []; }

    const bubbleEl   = document.getElementById('commentBubble');
    const popoverEl  = document.getElementById('commentPopover');
    const sidebarEl  = document.getElementById('commentsSidebar');
    const toggleEl   = document.getElementById('commentsToggle');
    const closeEl    = document.getElementById('commentsClose');
    const sbBody     = document.getElementById('commentsBody');
    const sbFooter   = document.getElementById('commentsFooter');
    const btnBubble  = document.getElementById('commentBubbleBtn');

    const saveDrafts = () => localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts));
    const newId = () => 'c_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
    const htmlEsc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const tt = (ko, en) => LANG === 'ko' ? ko : en;
    const fmtTime = (iso) => {
      if (!iso) return '';
      try { return new Date(iso).toLocaleString(LANG === 'ko' ? 'ko-KR' : 'en-US', { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' }); }
      catch { return iso; }
    };
    const cssEscape = (s) => (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/(["\\])/g, '\\$1');

    const hideBubble = () => { bubbleEl.style.display = 'none'; bubbleEl.dataset.anchorId = ''; bubbleEl.dataset.anchorText = ''; };
    const hidePopover = () => { popoverEl.style.display = 'none'; popoverEl.dataset.anchorId = ''; popoverEl.dataset.anchorText = ''; };

    const findAnchor = (node) => {
      while (node && node !== document.body) {
        if (node.nodeType === 1 && node.dataset && node.dataset.anchorId) return node;
        node = node.parentNode;
      }
      return null;
    };

    const openSidebar  = () => { sidebarEl.classList.add('open'); localStorage.setItem(OPEN_KEY, '1'); };
    const closeSidebar = () => { sidebarEl.classList.remove('open'); localStorage.setItem(OPEN_KEY, '0'); };

    toggleEl.addEventListener('click', () => sidebarEl.classList.contains('open') ? closeSidebar() : openSidebar());
    closeEl.addEventListener('click', closeSidebar);

    // --- Selection detection
    document.addEventListener('mouseup', (e) => {
      if (popoverEl.contains(e.target) || sidebarEl.contains(e.target) || bubbleEl.contains(e.target) || toggleEl.contains(e.target)) return;
      setTimeout(() => {
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) { hideBubble(); return; }
        const text = sel.toString().trim();
        if (!text || text.length < 2) { hideBubble(); return; }
        const range = sel.getRangeAt(0);
        const anchor = findAnchor(range.commonAncestorContainer);
        if (!anchor) { hideBubble(); return; }
        const rect = range.getBoundingClientRect();
        bubbleEl.style.display = 'block';
        bubbleEl.style.top  = (window.scrollY + rect.top - 38) + 'px';
        bubbleEl.style.left = (window.scrollX + Math.min(rect.right, window.innerWidth - 120)) + 'px';
        bubbleEl.dataset.anchorId   = anchor.dataset.anchorId;
        bubbleEl.dataset.anchorText = text.slice(0, 400);
      }, 10);
    });
    document.addEventListener('mousedown', (e) => {
      if (!bubbleEl.contains(e.target) && !popoverEl.contains(e.target)) hideBubble();
    });

    // --- Bubble → popover
    btnBubble.addEventListener('click', () => {
      const aid = bubbleEl.dataset.anchorId;
      const atext = bubbleEl.dataset.anchorText;
      if (!aid) return;
      const top = parseFloat(bubbleEl.style.top) || (window.scrollY + 120);
      hideBubble();
      window.getSelection()?.removeAllRanges();
      popoverEl.style.display = 'block';
      popoverEl.style.top = (top + 40) + 'px';
      popoverEl.style.left = '50%';
      popoverEl.style.transform = 'translateX(-50%)';
      popoverEl.dataset.anchorId   = aid;
      popoverEl.dataset.anchorText = atext;
      popoverEl.querySelector('.popover-quote').textContent = `"${atext}"`;
      const ta = popoverEl.querySelector('.popover-input');
      ta.value = '';
      ta.focus();
    });

    popoverEl.querySelector('[data-action="cancel"]').addEventListener('click', hidePopover);
    popoverEl.querySelector('[data-action="add"]').addEventListener('click', () => {
      const text = popoverEl.querySelector('.popover-input').value.trim();
      if (!text) { toast(tt('내용을 입력하세요', 'Please enter a comment')); return; }
      drafts.push({
        id: newId(),
        anchor_id: popoverEl.dataset.anchorId,
        anchor_text: popoverEl.dataset.anchorText,
        comment: text,
        created_at: new Date().toISOString(),
      });
      saveDrafts();
      hidePopover();
      renderSidebar();
      applyDecorations();
      openSidebar();
    });
    popoverEl.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hidePopover();
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) popoverEl.querySelector('[data-action="add"]').click();
    });

    // --- Render sidebar
    const renderSidebar = () => {
      const orphans = submitted.filter((c) => !document.querySelector(`[data-anchor-id="${cssEscape(c.anchor_id || '')}"]`));
      const orphanIds = new Set(orphans.map((c) => c.id));
      const active    = submitted.filter((c) => !c.resolved && !orphanIds.has(c.id));
      const resolved  = submitted.filter((c) =>  c.resolved && !orphanIds.has(c.id));
      const resolvedVisible = localStorage.getItem(RESOLVED_VISIBLE_KEY) === '1';

      const sections = [];
      if (drafts.length) {
        sections.push(`<div class="csec"><h4>${tt('초안','Drafts')} <span class="csec-count">${drafts.length}</span></h4>${drafts.map(renderDraftCard).join('')}</div>`);
      }
      sections.push(`<div class="csec"><h4>${tt('진행중','Active')} <span class="csec-count">${active.length}</span></h4>${active.length ? active.map((c) => renderSubmittedCard(c, 'active')).join('') : `<div class="empty">${tt('없음','None')}</div>`}</div>`);
      if (resolved.length) {
        sections.push(`<div class="csec ${resolvedVisible?'':'collapsed'}" data-section="resolved"><h4 data-resolved-toggle>${tt('해결됨','Resolved')} <span class="csec-count">${resolved.length}</span> <span class="csec-toggle">${resolvedVisible?'▼':'▶'}</span></h4><div class="csec-body" style="display:${resolvedVisible?'block':'none'}">${resolved.map((c) => renderSubmittedCard(c, 'resolved')).join('')}</div></div>`);
      }
      if (orphans.length) {
        sections.push(`<div class="csec"><h4>${tt('위치 없음','Orphaned')} <span class="csec-count">${orphans.length}</span></h4>${orphans.map((c) => renderSubmittedCard(c, 'orphaned')).join('')}</div>`);
      }
      sbBody.innerHTML = sections.join('');

      if (drafts.length) {
        sbFooter.style.display = 'flex';
        sbFooter.innerHTML = `<button class="btn" id="discardDrafts">${tt('전체 삭제','Discard all')}</button><button class="btn btn-primary" id="submitDrafts">${tt(drafts.length+'개 모두 제출', 'Submit '+drafts.length)}</button>`;
        document.getElementById('discardDrafts').addEventListener('click', () => {
          if (confirm(tt('모든 draft 를 삭제할까요?','Discard all drafts?'))) {
            drafts = []; saveDrafts(); renderSidebar(); applyDecorations();
          }
        });
        document.getElementById('submitDrafts').addEventListener('click', submitAllDrafts);
      } else {
        sbFooter.style.display = 'none';
        sbFooter.innerHTML = '';
      }

      // event delegation
      sbBody.querySelectorAll('[data-resolved-toggle]').forEach((h) => h.addEventListener('click', () => {
        const sec = h.closest('[data-section]');
        const body = sec.querySelector('.csec-body');
        const isOpen = body.style.display !== 'none';
        body.style.display = isOpen ? 'none' : 'block';
        sec.classList.toggle('collapsed', isOpen);
        h.querySelector('.csec-toggle').textContent = isOpen ? '▶' : '▼';
        localStorage.setItem(RESOLVED_VISIBLE_KEY, isOpen ? '0' : '1');
      }));
      sbBody.querySelectorAll('[data-draft-edit]').forEach((el) => el.addEventListener('input', () => {
        const id = el.dataset.draftEdit;
        const d = drafts.find((x) => x.id === id);
        if (d) { d.comment = el.value; saveDrafts(); }
      }));
      sbBody.querySelectorAll('[data-draft-delete]').forEach((el) => el.addEventListener('click', () => {
        drafts = drafts.filter((d) => d.id !== el.dataset.draftDelete);
        saveDrafts(); renderSidebar(); applyDecorations();
      }));
      sbBody.querySelectorAll('[data-resolve]').forEach((el) => el.addEventListener('click', () => {
        resolveComment(el.dataset.resolve, el.dataset.resolveValue !== 'true');
      }));
      sbBody.querySelectorAll('[data-jump-to]').forEach((el) => el.addEventListener('click', () => {
        const aid = el.dataset.jumpTo;
        const target = document.querySelector(`[data-anchor-id="${cssEscape(aid)}"]`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.add('flash');
          setTimeout(() => target.classList.remove('flash'), 1200);
        }
      }));

      const totalUnresolved = drafts.length + active.length;
      toggleEl.querySelector('.count').textContent = totalUnresolved || '';
      toggleEl.classList.toggle('has-items', totalUnresolved > 0);
    };

    const renderDraftCard = (d) => `
      <div class="cc cc-draft" data-anchor-id="${htmlEsc(d.anchor_id)}">
        <div class="cc-quote" data-jump-to="${htmlEsc(d.anchor_id)}">"${htmlEsc(d.anchor_text)}"</div>
        <textarea class="cc-input" data-draft-edit="${htmlEsc(d.id)}">${htmlEsc(d.comment)}</textarea>
        <div class="cc-actions">
          <button class="cc-action danger" data-draft-delete="${htmlEsc(d.id)}">${tt('삭제','Delete')}</button>
        </div>
      </div>`;

    const renderSubmittedCard = (c, state) => {
      const replies = (c.replies || []).map((r) => `
        <div class="cc-reply cc-reply-${htmlEsc(r.by)}">
          <div class="cc-reply-head">${r.by === 'claude' ? 'Claude' : tt('나','Me')} · <span class="cc-time">${htmlEsc(fmtTime(r.at))}</span></div>
          <div class="cc-reply-body">${htmlEsc(r.text)}</div>
        </div>`).join('');
      const isOrphan = state === 'orphaned';
      const cls = state === 'resolved' ? 'cc-resolved' : (isOrphan ? 'cc-orphaned' : 'cc-active');
      const quoteAttr = isOrphan ? '' : ` data-jump-to="${htmlEsc(c.anchor_id)}"`;
      const orphanTag = isOrphan ? ` <span class="cc-orphan-tag">${tt('위치 없음','orphan')}</span>` : '';
      return `
        <div class="cc ${cls}" data-comment-id="${htmlEsc(c.id)}" data-anchor-id="${htmlEsc(c.anchor_id)}">
          <div class="cc-quote"${quoteAttr}>"${htmlEsc(c.anchor_text)}"${orphanTag}</div>
          <div class="cc-body">${htmlEsc(c.comment)}</div>
          ${replies}
          <div class="cc-actions">
            <button class="cc-action" data-resolve="${htmlEsc(c.id)}" data-resolve-value="${c.resolved ? 'true':'false'}">${c.resolved ? tt('미해결로','Unresolve') : tt('해결됨','Resolve')}</button>
          </div>
        </div>`;
    };

    const resolveComment = async (id, val) => {
      try {
        const res = await fetch(`${HELPER_BASE}/resolve`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, resolved: !!val }),
        });
        if (!res.ok) throw new Error(await res.text());
        const c = submitted.find((x) => x.id === id);
        if (c) c.resolved = !!val;
        renderSidebar(); applyDecorations();
      } catch (e) { toast('Error: ' + e.message); }
    };

    const submitAllDrafts = async () => {
      if (!drafts.length) return;
      try {
        const res = await fetch(`${HELPER_BASE}/reviews`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comments: drafts }),
        });
        if (!res.ok) throw new Error(await res.text());
        toast(tt(`${drafts.length}개 코멘트 제출됨 ✓`, `${drafts.length} comments submitted ✓`));
        drafts = []; saveDrafts();
        // SSE 가 곧 reload 트리거 — 새 submitted 가 반영됨
        renderSidebar(); applyDecorations();
      } catch (e) { toast('Error: ' + e.message); }
    };

    const applyDecorations = () => {
      document.querySelectorAll('.has-comments').forEach((el) => el.classList.remove('has-comments'));
      document.querySelectorAll('.comment-badge').forEach((el) => el.remove());
      const counts = new Map();
      for (const d of drafts) counts.set(d.anchor_id, (counts.get(d.anchor_id) || 0) + 1);
      for (const c of submitted) {
        if (c.resolved) continue;
        counts.set(c.anchor_id, (counts.get(c.anchor_id) || 0) + 1);
      }
      for (const [aid, n] of counts) {
        const el = document.querySelector(`[data-anchor-id="${cssEscape(aid)}"]`);
        if (!el) continue;
        el.classList.add('has-comments');
        const badge = document.createElement('span');
        badge.className = 'comment-badge';
        badge.textContent = n;
        badge.title = tt(`${n}개 코멘트`, `${n} comments`);
        badge.addEventListener('click', (e) => {
          e.stopPropagation();
          openSidebar();
          const card = sidebarEl.querySelector(`.cc[data-anchor-id="${cssEscape(aid)}"]`);
          if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        el.appendChild(badge);
      }
    };

    if (localStorage.getItem(OPEN_KEY) === '1') openSidebar();
    renderSidebar();
    applyDecorations();
  }

  // --- SSE auto-reload on file change
  try {
    const es = new EventSource(`${HELPER_BASE}/events`);
    es.addEventListener('reload', () => {
      persistAnswers();
      // small debounce so the writer can settle
      setTimeout(() => location.reload(), 250);
    });
    es.addEventListener('open', () => {/* connected */});
  } catch (e) { /* helper offline; no auto-reload */ }
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js" onerror="document.querySelectorAll('.mermaid').forEach(el=>{el.style.whiteSpace='pre';el.style.fontFamily='monospace'})"></script>
<script>
  if (window.mermaid) {
    const dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light';
    window.mermaid.initialize({ startOnLoad: true, theme: dark ? 'dark' : 'default' });
  }
</script>
</body>
